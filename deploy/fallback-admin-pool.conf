; PROPOSED new isolated pool; do not edit an existing production pool.
[fallback-admin]
user = fallback-web
group = fallback-web
listen = /run/php/fallback-admin.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 10s
pm.max_requests = 200
request_terminate_timeout = 15s
clear_env = yes
env[FH_ADMIN_DATA] = /var/lib/fallback-web/admin
env[FH_ADMIN_ORIGIN] = https://lab.ventureout.cz
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/lib/fallback-web/admin/php-error.log
php_admin_value[memory_limit] = 128M
php_admin_value[post_max_size] = 16K
php_admin_value[max_input_vars] = 64
php_admin_flag[file_uploads] = off
php_admin_flag[allow_url_fopen] = off
php_admin_flag[expose_php] = off
php_admin_value[open_basedir] = /var/www/fallback-admin/:/var/lib/fallback-web/admin/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
