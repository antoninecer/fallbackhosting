# New isolated host only. No changes to existing virtual hosts.
server {
    listen 80;
    server_name lab.ventureout.cz;
    root /opt/fallback/lab-public;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://lab.ventureout.cz$request_uri; }
}
