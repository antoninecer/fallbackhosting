server {
    listen 80;
    server_name lab.ventureout.cz;
    root /opt/fallback/lab-public;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://lab.ventureout.cz$request_uri; }
}
server {
    listen 443 ssl;
    server_name lab.ventureout.cz;
    ssl_certificate /etc/letsencrypt/live/lab.ventureout.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab.ventureout.cz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/fallback/lab-public;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; connect-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Cache-Control "no-cache" always;
    location ~ /\. { return 404; }
    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /style.css { try_files $uri =404; }
    location / { return 404; }
}
