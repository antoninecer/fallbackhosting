# Proposed lab application host. Existing project progress host remains unchanged.
server {
    listen 80;
    server_name lab.ventureout.cz;
    root /opt/fallback/lab-public;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://lab.ventureout.cz$request_uri; }
}
server {
    listen 443 ssl;
    server_name lab.ventureout.cz;
    ssl_certificate /etc/letsencrypt/live/lab.ventureout.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab.ventureout.cz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/fallback-admin/current/public;
    client_max_body_size 16k;
    client_body_timeout 10s;
    autoindex off;
    location = /admin.css { try_files $uri =404; }
    location = / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/fallback-admin/current/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/fallback-admin.sock;
        fastcgi_read_timeout 15s;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/fallback-admin/current/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/fallback-admin.sock;
        fastcgi_read_timeout 15s;
    }
    location / { return 404; }
}
